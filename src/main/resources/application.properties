spring.application.name=demo

server.port=${PORT:8080}

# Configuración de base de datos con soporte para Render/Nube (H2 por defecto o MySQL vía variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:demo_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 para inspección rápida
spring.h2.console.enabled=true
